<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Scan — La Carcasse</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="scan-page">
  <div class="scan-logo"><img src="logo.png" alt="La Carcasse"></div>

  <div id="s-norunner" style="display:none;width:100%;max-width:340px;text-align:center">
    <i class="ti ti-user-question" style="font-size:64px;color:var(--muted);margin-bottom:16px;display:block"></i>
    <div style="font-family:var(--font-title);font-size:28px;letter-spacing:1px;margin-bottom:8px">PAS IDENTIFIÉ</div>
    <div style="font-size:14px;color:var(--muted);margin-bottom:24px">Tu dois d'abord te connecter dans l'application.</div>
    <a href="/" class="scan-back-btn"><i class="ti ti-arrow-left"></i> OUVRIR L'APP</a>
  </div>

  <div id="s-loading" style="display:none;text-align:center">
    <div id="s-point-label" class="scan-badge"></div>
    <div id="s-runner-label" class="scan-runner-lbl"></div>
    <div style="color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;justify-content:center">
      <i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Enregistrement...
    </div>
  </div>

  <div id="s-result" style="display:none;width:100%;max-width:360px;text-align:center">
    <div id="s-result-icon" style="font-size:64px;margin-bottom:10px"></div>
    <div id="s-result-point" class="scan-badge" style="margin-bottom:4px"></div>
    <div id="s-result-runner" class="scan-runner-lbl"></div>
    <div id="s-result-msg" class="scan-result-box"></div>
    <div id="s-context-box" style="display:none;width:100%;margin-bottom:16px"></div>
    <div id="s-countdown-box" style="display:none;margin-bottom:16px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600">Retour à l'app dans</div>
      <div class="scan-countdown-val" id="s-countdown-val">4</div>
      <div class="scan-progress"><div class="scan-progress-bar" id="s-progress-bar"></div></div>
    </div>
    <a href="/" class="scan-back-btn" id="s-back-btn">
      <i class="ti ti-layout-dashboard"></i> RETOUR À L'APPLICATION
    </a>
  </div>
</div>

<script>
const LOOP_KM = 6.0;

function fmtTime(s) {
  if (!s && s !== 0) return '--';
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if (h>0) return `${h}H ${m}M ${sec}S`;
  if (m>0) return `${m}M ${sec}S`;
  return `${sec}S`;
}

function pace(seconds) {
  if (!seconds || seconds <= 0) return '--';
  const totalMin = seconds/60/LOOP_KM;
  const m=Math.floor(totalMin), s=Math.round((totalMin-m)*60);
  return `${m}'${String(s).padStart(2,'0')}"`;
}

function startAutoRedirect() {
  const box = document.getElementById('s-countdown-box');
  const val = document.getElementById('s-countdown-val');
  const bar = document.getElementById('s-progress-bar');
  box.style.display = 'block';
  let remaining = 4;
  val.textContent = remaining;
  setTimeout(() => { bar.style.width = '0%'; }, 50);
  const iv = setInterval(() => {
    remaining--;
    val.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(iv);
      window.close();
      setTimeout(() => { window.location.href = '/'; }, 300);
    }
  }, 1000);
}

async function doScan() {
  const name = localStorage.getItem('backyard_runner');
  const point = new URLSearchParams(window.location.search).get('point');
  if (!name) { document.getElementById('s-norunner').style.display = 'block'; return; }

  const label = point === 'start' ? 'ARRIVÉE' : 'CHECKPOINT';
  document.getElementById('s-loading').style.display = 'block';
  const pl = document.getElementById('s-point-label');
  pl.textContent = label;
  pl.className = 'scan-badge ' + (point === 'start' ? 'start' : 'checkpoint');
  document.getElementById('s-runner-label').textContent = name;

  try {
    const res = await fetch('/api/scan', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, point })
    });
    const data = await res.json();

    document.getElementById('s-loading').style.display = 'none';
    document.getElementById('s-result').style.display = 'block';

    document.getElementById('s-result-icon').textContent =
      data.loop_validated ? '🏆' : data.ok ? '✅' : '⚠️';
    const rp = document.getElementById('s-result-point');
    rp.textContent = label;
    rp.className = 'scan-badge ' + (point === 'start' ? 'start' : 'checkpoint');
    document.getElementById('s-result-runner').textContent = name;

    const msg = document.getElementById('s-result-msg');
    if (data.pre_race) {
      msg.textContent = data.message;
      msg.style.background = '#1a1a2e';
      msg.style.color = '#a78bfa';
      msg.style.border = '1px solid #4c1d95';
    } else {
      msg.textContent = data.message;
      msg.className = 'scan-result-box ' + (data.ok ? 'ok' : 'error');
    }

    // Infos contextuelles
    const ctx = document.getElementById('s-context-box');
    if (data.ok && point === 'checkpoint' && data.elapsed_seconds !== undefined) {
      ctx.style.display = 'block';
      ctx.innerHTML = `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:left">
          <div style="font-family:var(--font-title);font-size:14px;letter-spacing:1px;color:#60a5fa;margin-bottom:10px"><i class="ti ti-flag-2"></i> MI-PARCOURS — 3 KM</div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase">Temps de passage</span>
            <span style="font-family:var(--font-title);font-size:18px;color:var(--green)">${fmtTime(data.elapsed_seconds)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0">
            <span style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase">Projection boucle</span>
            <span style="font-family:var(--font-title);font-size:18px;color:var(--amber)">${fmtTime(data.elapsed_seconds*2)}</span>
          </div>
        </div>`;
    } else if (data.ok && data.loop_validated && data.duration) {
      ctx.style.display = 'block';
      ctx.innerHTML = `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:left">
          <div style="font-family:var(--font-title);font-size:14px;letter-spacing:1px;color:var(--accent);margin-bottom:10px"><i class="ti ti-circle-check"></i> BOUCLE COMPLÉTÉE — 6 KM</div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase">Temps de boucle</span>
            <span style="font-family:var(--font-title);font-size:18px;color:var(--green)">${fmtTime(data.duration)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0">
            <span style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase">Allure moyenne</span>
            <span style="font-family:var(--font-title);font-size:18px;color:#60a5fa">${pace(data.duration)} /km</span>
          </div>
        </div>`;
    }

    if (data.ok && !data.pre_race) startAutoRedirect();

  } catch(e) {
    document.getElementById('s-loading').style.display = 'none';
    document.getElementById('s-result').style.display = 'block';
    document.getElementById('s-result-icon').textContent = '❌';
    document.getElementById('s-result-msg').textContent = 'Erreur réseau.';
    document.getElementById('s-result-msg').className = 'scan-result-box error';
  }
}

doScan();
</script>
</body>
</html>
