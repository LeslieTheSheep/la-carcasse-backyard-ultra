<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Scan — La Carcasse</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="scan-page">
  <div class="scan-logo"><img src="logo.png" alt="La Carcasse"></div>

  <!-- Pas identifié -->
  <div id="s-norunner" style="display:none;width:100%;max-width:340px;text-align:center">
    <i class="ti ti-user-question" style="font-size:64px;color:var(--muted);margin-bottom:16px;display:block"></i>
    <div style="font-size:20px;font-weight:700;margin-bottom:8px">Pas identifié</div>
    <div style="font-size:14px;color:var(--muted);margin-bottom:24px">Tu dois d'abord te connecter dans l'application.</div>
    <a href="/" class="btn btn-accent"><i class="ti ti-arrow-left"></i> Ouvrir l'app</a>
  </div>

  <!-- Chargement -->
  <div id="s-loading" style="display:none;text-align:center">
    <div id="s-point-label" class="scan-badge"></div>
    <div id="s-runner-label" class="scan-runner-lbl"></div>
    <div style="color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;justify-content:center">
      <i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Enregistrement...
    </div>
  </div>

  <!-- Résultat -->
  <div id="s-result" style="display:none;width:100%;max-width:360px;text-align:center">
    <div id="s-result-icon" style="font-size:56px;margin-bottom:10px"></div>
    <div id="s-result-point" class="scan-badge" style="margin-bottom:4px"></div>
    <div id="s-result-runner" class="scan-runner-lbl"></div>
    <div id="s-result-msg" class="scan-result-box"></div>

    <!-- Infos contextuelles -->
    <div id="s-context-box" style="display:none;width:100%;margin-bottom:16px"></div>

    <!-- Compte à rebours fermeture -->
    <div id="s-countdown-box" style="margin-bottom:16px;display:none">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Retour à l'application dans</div>
      <div id="s-countdown-val" style="font-size:36px;font-weight:900;color:var(--accent)">4</div>
      <div style="width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden">
        <div id="s-progress-bar" style="height:100%;background:var(--accent);width:100%;transition:width 1s linear;border-radius:2px"></div>
      </div>
    </div>

    <!-- Bouton retour manuel -->
    <a href="/" class="btn btn-accent" style="margin-bottom:10px" id="s-back-btn">
      <i class="ti ti-layout-dashboard"></i> Retour à l'application
    </a>
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
.context-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 4px;
}
.context-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.context-row:last-child { border-bottom: none; }
.context-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.context-val { font-size: 18px; font-weight: 800; }
</style>

<script>
const LOOP_KM = 6.0;
const APP_URL = '/';
const REDIRECT_DELAY = 4; // secondes avant redirection

function fmtTime(s) {
  if (!s && s !== 0) return '--';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h > 0) return `${h}h ${m}m ${sec}s`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function pace(seconds) {
  const totalMin = seconds / 60 / LOOP_KM;
  const m = Math.floor(totalMin), s = Math.round((totalMin - m) * 60);
  return `${m}'${String(s).padStart(2,'0')}"`;
}

// Ferme l'onglet et retourne à l'app après le délai
function startAutoRedirect() {
  const countdownBox = document.getElementById('s-countdown-box');
  const countdownVal = document.getElementById('s-countdown-val');
  const progressBar = document.getElementById('s-progress-bar');
  countdownBox.style.display = 'block';

  let remaining = REDIRECT_DELAY;
  countdownVal.textContent = remaining;

  // Lancer la barre de progression
  setTimeout(() => { progressBar.style.width = '0%'; }, 50);

  const interval = setInterval(() => {
    remaining--;
    countdownVal.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(interval);
      // Essayer de fermer l'onglet
      window.close();
      // Si ça ne marche pas (la plupart des navigateurs bloquent ça),
      // rediriger vers l'app
      setTimeout(() => { window.location.href = APP_URL; }, 300);
    }
  }, 1000);
}

async function doScan() {
  const name = localStorage.getItem('backyard_runner');
  const point = new URLSearchParams(window.location.search).get('point');

  if (!name) { document.getElementById('s-norunner').style.display = 'block'; return; }

  const label = point === 'start' ? 'START' : 'CHECKPOINT';
  document.getElementById('s-loading').style.display = 'block';
  const pl = document.getElementById('s-point-label');
  pl.textContent = label; pl.className = 'scan-badge ' + point;
  document.getElementById('s-runner-label').textContent = name;

  try {
    const res = await fetch('/api/scan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, point })
    });
    const data = await res.json();

    document.getElementById('s-loading').style.display = 'none';
    document.getElementById('s-result').style.display = 'block';

    document.getElementById('s-result-icon').textContent =
      data.loop_validated ? '🏆' : data.ok ? '✅' : '⚠️';
    const rp = document.getElementById('s-result-point');
    rp.textContent = label; rp.className = 'scan-badge ' + point;
    document.getElementById('s-result-runner').textContent = name;
    const msg = document.getElementById('s-result-msg');
    msg.textContent = data.message;
    msg.className = 'scan-result-box ' + (data.ok ? 'ok' : 'error');

    // ---- INFOS CONTEXTUELLES ----
    const ctxBox = document.getElementById('s-context-box');

    if (data.ok && point === 'checkpoint' && data.elapsed_seconds !== undefined) {
      ctxBox.style.display = 'block';
      const elapsed = data.elapsed_seconds;
      ctxBox.innerHTML = `
        <div class="context-card">
          <div style="font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">
            <i class="ti ti-flag-2"></i> Mi-parcours — 3 km
          </div>
          <div class="context-row">
            <div class="context-label">Temps de passage</div>
            <div class="context-val" style="color:var(--green)">${fmtTime(elapsed)}</div>
          </div>
          <div class="context-row">
            <div class="context-label">Allure 1ère moitié</div>
            <div class="context-val" style="color:var(--blue)">${pace(elapsed * 2)}<span style="font-size:12px;color:var(--muted)"> /km</span></div>
          </div>
          <div class="context-row">
            <div class="context-label">Projection boucle</div>
            <div class="context-val" style="color:var(--amber)">${fmtTime(elapsed * 2)}</div>
          </div>
        </div>`;

    } else if (data.ok && data.loop_validated && data.duration) {
      ctxBox.style.display = 'block';
      const dur = data.duration;
      ctxBox.innerHTML = `
        <div class="context-card">
          <div style="font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">
            <i class="ti ti-circle-check"></i> Boucle complétée — 6 km
          </div>
          <div class="context-row">
            <div class="context-label">Temps de boucle</div>
            <div class="context-val" style="color:var(--green)">${fmtTime(dur)}</div>
          </div>
          <div class="context-row">
            <div class="context-label">Allure moyenne</div>
            <div class="context-val" style="color:var(--blue)">${pace(dur)}<span style="font-size:12px;color:var(--muted)"> /km</span></div>
          </div>
        </div>`;
    }

    // Lancer la redirection automatique uniquement si le scan est OK
    if (data.ok) {
      startAutoRedirect();
    }

  } catch(e) {
    document.getElementById('s-loading').style.display = 'none';
    document.getElementById('s-result').style.display = 'block';
    document.getElementById('s-result-icon').textContent = '❌';
    document.getElementById('s-result-msg').textContent = 'Erreur réseau. Vérifie ta connexion.';
    document.getElementById('s-result-msg').className = 'scan-result-box error';
    // Pas de redirection automatique en cas d'erreur
  }
}

doScan();
</script>
</body>
</html>
